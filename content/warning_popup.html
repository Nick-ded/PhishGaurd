<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhishGuard Warning</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f4f1e8;
      --surface: #ffffff;
      --surface-soft: #eef3e7;
      --surface-muted: #f8f6ef;
      --border: #d8d2c1;
      --text: #1f2a19;
      --text-muted: #5f6d58;
      --text-dim: #7f8a78;
      --green: #27500A;
      --green-weak: #3B6D11;
      --amber: #BA7517;
      --danger: #A32D2D;
      --shadow: 0 12px 30px rgba(35, 47, 24, 0.12);
    }

    body {
      font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      background: rgba(0, 0, 0, 0.8);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .pg-warning-modal {
      background: linear-gradient(180deg, #fbfaf5 0%, #f3efe3 100%);
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      max-width: 480px;
      width: 100%;
      padding: 24px;
      position: relative;
    }

    .pg-warning-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .pg-warning-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .pg-warning-icon.dangerous {
      background: rgba(163, 45, 45, 0.12);
      color: var(--danger);
    }

    .pg-warning-icon.suspicious {
      background: rgba(186, 117, 23, 0.12);
      color: var(--amber);
    }

    .pg-warning-icon svg {
      width: 24px;
      height: 24px;
    }

    .pg-warning-content {
      flex: 1;
      min-width: 0;
    }

    .pg-warning-title {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .pg-warning-title.dangerous {
      color: var(--danger);
    }

    .pg-warning-title.suspicious {
      color: var(--amber);
    }

    .pg-warning-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .pg-warning-url {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin: 16px 0;
      word-break: break-all;
      font-size: 13px;
      color: var(--text-muted);
    }

    .pg-warning-details {
      background: var(--surface-muted);
      border: 1px solid rgba(94, 107, 86, 0.12);
      border-radius: 14px;
      padding: 14px;
      margin: 16px 0;
    }

    .pg-warning-details-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text);
    }

    .pg-warning-flags {
      list-style: none;
    }

    .pg-warning-flags li {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 4px;
      padding-left: 16px;
      position: relative;
    }

    .pg-warning-flags li::before {
      content: '•';
      position: absolute;
      left: 0;
      color: var(--danger);
      font-weight: bold;
    }

    .pg-warning-flags.suspicious li::before {
      color: var(--amber);
    }

    .pg-warning-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .pg-warning-btn {
      flex: 1;
      padding: 12px 16px;
      border: 0;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 120ms ease, opacity 120ms ease;
      font-family: inherit;
    }

    .pg-warning-btn:hover {
      transform: translateY(-1px);
    }

    .pg-warning-btn:active {
      transform: translateY(0);
    }

    .pg-warning-btn-primary {
      background: var(--green);
      color: #f4f9ee;
    }

    .pg-warning-btn-secondary {
      background: var(--surface-soft);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .pg-warning-btn-danger {
      background: rgba(163, 45, 45, 0.08);
      color: var(--danger);
      border: 1px solid rgba(163, 45, 45, 0.2);
    }

    .pg-brand-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(94, 107, 86, 0.12);
      font-size: 11px;
      color: var(--text-dim);
    }

    .pg-brand-footer-icon {
      width: 16px;
      height: 16px;
      color: var(--green);
    }

    @keyframes pg-modal-in {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(10px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .pg-warning-modal {
      animation: pg-modal-in 0.2s ease-out;
    }
  </style>
</head>
<body>
  <div class="pg-warning-modal">
    <div class="pg-warning-header">
      <div class="pg-warning-icon" id="warningIcon">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M8 8l8 8M16 8l-8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="pg-warning-content">
        <div class="pg-warning-title" id="warningTitle">Dangerous Website Detected</div>
        <div class="pg-warning-subtitle" id="warningSubtitle">This website may be unsafe to visit</div>
      </div>
    </div>

    <div class="pg-warning-url" id="warningUrl">
      Loading...
    </div>

    <div class="pg-warning-details">
      <div class="pg-warning-details-title">Why is this site flagged?</div>
      <ul class="pg-warning-flags" id="warningFlags">
        <li>Loading threat analysis...</li>
      </ul>
    </div>

    <div class="pg-warning-actions">
      <button class="pg-warning-btn pg-warning-btn-primary" id="goBackBtn">
        ← Go Back Safely
      </button>
      <button class="pg-warning-btn pg-warning-btn-danger" id="continueBtn">
        Continue Anyway
      </button>
    </div>

    <div class="pg-brand-footer">
      <svg class="pg-brand-footer-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M12 2 4 5v6c0 5 3.2 9.4 8 11 4.8-1.6 8-6 8-11V5l-8-3Zm-1 12.4-2.6-2.6 1.4-1.4L11 11.6l4.2-4.2 1.4 1.4-5.6 5.6Z"/>
      </svg>
      Protected by PhishGuard
    </div>
  </div>

  <script>
    // Get URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const targetUrl = urlParams.get('url') || 'Unknown URL';
    const verdict = urlParams.get('verdict') || 'DANGEROUS';
    const score = urlParams.get('score') || '100';
    const flags = urlParams.get('flags') ? decodeURIComponent(urlParams.get('flags')).split('|') : ['Unknown threat detected'];

    // DOM elements
    const warningIcon = document.getElementById('warningIcon');
    const warningTitle = document.getElementById('warningTitle');
    const warningSubtitle = document.getElementById('warningSubtitle');
    const warningUrl = document.getElementById('warningUrl');
    const warningFlags = document.getElementById('warningFlags');
    const goBackBtn = document.getElementById('goBackBtn');
    const continueBtn = document.getElementById('continueBtn');

    // Configure UI based on verdict
    function setupWarning() {
      const isDangerous = verdict === 'DANGEROUS';
      const isSuspicious = verdict === 'SUSPICIOUS';

      // Update icon and colors
      if (isDangerous) {
        warningIcon.className = 'pg-warning-icon dangerous';
        warningTitle.className = 'pg-warning-title dangerous';
        warningTitle.textContent = 'Dangerous Website Blocked';
        warningSubtitle.textContent = 'This website contains threats and should be avoided';
        warningFlags.className = 'pg-warning-flags';
      } else if (isSuspicious) {
        warningIcon.className = 'pg-warning-icon suspicious';
        warningTitle.className = 'pg-warning-title suspicious';
        warningTitle.textContent = 'Suspicious Website Detected';
        warningSubtitle.textContent = 'This website shows warning signs and needs review';
        warningFlags.className = 'pg-warning-flags suspicious';
        
        // Update icon for suspicious
        warningIcon.innerHTML = `
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M7.5 7.5 16.5 16.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        `;
      }

      // Display URL
      warningUrl.textContent = targetUrl;

      // Display flags
      warningFlags.innerHTML = flags.map(flag => `<li>${escapeHtml(flag)}</li>`).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Event handlers
    goBackBtn.addEventListener('click', () => {
      // Try to go back in history, or close tab if no history
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.close();
      }
    });

    continueBtn.addEventListener('click', () => {
      // Navigate to the target URL
      window.location.href = targetUrl;
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        goBackBtn.click();
      } else if (e.key === 'Enter' && e.ctrlKey) {
        continueBtn.click();
      }
    });

    // Initialize
    setupWarning();
  </script>
</body>
</html>
